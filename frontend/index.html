<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimitri's Portfolio</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="hero-section">
        <div class="spotlight">
            <div class="spotlight-emitter"></div>
            <div class="beam"></div>
        </div>
        <div class="presentation">
            <div class="presentation-content">
                <h1 class="presentation-name">Dimitri Schulz Amado</h1>
                <p class="presentation-role">Backend Software Engineer</p>
                <p class="presentation-bio">
                    Passionate about building resilient backends, clean APIs, intuitive
                    and scalable user experiences, and leveraging the power of AI to
                    enhance business value.
                </p>
            </div>
            <div class="presentation-image-wrapper">
                <img src="assets/images/profile.png" alt="Dimitri" class="presentation-image">
            </div>
        </div>
        <a href="#projects" class="scroll-indicator" aria-label="Scroll to projects">
            <span class="scroll-arrow"></span>
        </a>
    </header>

    <main id="projects" class="content-section">
        <div class="container">
            <h2>Projects</h2>
            <div id="projects-container"></div>
        </div>
    </main>

    <script type="module" src="js/app.js"></script>
</body>

</html>
